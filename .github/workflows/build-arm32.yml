name: Build ARM32 Android test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm32:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out this build project
        uses: actions/checkout@v4

      - name: Check out Xash3D FWGS source and submodules
        uses: actions/checkout@v4
        with:
          repository: FWGS/xash3d-fwgs
          ref: master
          path: upstream
          submodules: recursive
          fetch-depth: 0

      - name: Check out SDL Android sources
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: release-2.32.8
          path: upstream/3rdparty/SDL

      - name: Check out HLSDK portable and nested submodules
        uses: actions/checkout@v4
        with:
          repository: FWGS/hlsdk-portable
          ref: mobile_hacks
          path: upstream/3rdparty/hlsdk-portable
          submodules: recursive
          fetch-depth: 0

      - name: Check out NanoGL (upstream marks this submodule update=none)
        uses: actions/checkout@v4
        with:
          repository: FWGS/nanogl
          ref: master
          path: upstream/3rdparty/nanogl

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865"

      - name: Restrict native build to ARM32
        working-directory: upstream/android
        run: |
          sed -i 's/setOf("armeabi-v7a", "arm64-v8a", "x86")/setOf("armeabi-v7a")/' app/build.gradle.kts
          grep 'ninja.abiFilters' app/build.gradle.kts

      - name: Make native configuration fail with the real error
        working-directory: upstream
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("scripts/configure-ninja.py")
          s = p.read_text()
          replacements = [
              ("\t\tgit_process.communicate()", "\t\tgit_process.communicate()\n\t\tif git_process.returncode != 0:\n\t\t\traise RuntimeError('Git clone failed for ' + name)"),
              ("\tcmake_process.communicate()", "\tcmake_process.communicate()\n\tif cmake_process.returncode != 0:\n\t\traise RuntimeError('CMake configuration failed: ' + ' '.join(cmake_exec))"),
              ("\tprocess.communicate()", "\tprocess.communicate()\n\tif process.returncode != 0:\n\t\traise RuntimeError('Waf/Ninja configuration failed with exit code ' + str(process.returncode))"),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit("Expected configure-ninja.py pattern not found: " + repr(old))
              s = s.replace(old, new, 1)
          p.write_text(s)
          print("Patched configure-ninja.py to stop on Git/CMake/Waf errors")
          PY
          python3 -m py_compile scripts/configure-ninja.py
          grep -n -A2 -B1 'returncode' scripts/configure-ninja.py

      - name: Build debug APK
        working-directory: upstream/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xash3d-arm32-debug-apk
          path: upstream/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
